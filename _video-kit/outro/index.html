<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #04080f;
        --cyan: #00d4ff;
        --orange: #ff6b35;
        --ink: #ffffff;
        --muted: #8aa4b8;
        --font-display: "League Gothic", "Oswald", sans-serif;
        --font-mono: "Space Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); }
      #bg { position: absolute; inset: 0; }
      #grid {
        position: absolute; inset: -80px;
        background-image:
          linear-gradient(rgba(0, 212, 255, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 212, 255, 0.06) 1px, transparent 1px);
        background-size: 80px 80px;
      }
      #glow { position: absolute; inset: 0; background: radial-gradient(760px 460px at 50% 46%, rgba(0, 212, 255, 0.2), transparent 70%); }
      #center { position: absolute; left: 0; right: 0; top: 200px; display: flex; flex-direction: column; align-items: center; }
      #mark { position: relative; width: 240px; height: 240px; }
      #ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--cyan); box-shadow: 0 0 40px rgba(0, 212, 255, 0.5), inset 0 0 30px rgba(0, 212, 255, 0.25); }
      #ring2 { position: absolute; inset: -22px; border-radius: 50%; border: 2px dashed rgba(255, 107, 53, 0.7); }
      #mono { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 140px; color: var(--ink); letter-spacing: 4px; padding-top: 6px; }
      #name { margin-top: 70px; font-family: var(--font-display); font-size: 150px; letter-spacing: 14px; color: var(--ink); text-shadow: 0 0 40px rgba(0, 212, 255, 0.35); }
      #bar { width: 520px; height: 6px; margin-top: 8px; background: linear-gradient(90deg, var(--cyan), var(--orange)); }
      #role { margin-top: 30px; font-family: var(--font-mono); font-size: 30px; letter-spacing: 8px; color: var(--cyan); }
      #url { margin-top: 18px; font-family: var(--font-mono); font-size: 30px; letter-spacing: 4px; color: var(--ink); opacity: 0.85; }
      #legal { position: absolute; left: 0; right: 0; bottom: 90px; text-align: center; font-family: var(--font-mono); font-size: 28px; letter-spacing: 3px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.6" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="3.6" data-track-index="0" data-layout-allow-overflow>
        <div id="grid"></div>
        <div id="glow"></div>
      </div>
      <div id="center" class="clip" data-start="0" data-duration="3.6" data-track-index="1">
        <div id="mark">
          <div id="ring2"></div>
          <div id="ring"></div>
          <div id="mono">BF</div>
        </div>
        <div id="name">BASIT FAROOQ</div>
        <div id="bar"></div>
        <div id="role">UNITY GAME DEVELOPER · INTERACTIVE EXPERIENCES</div>
      </div>
      <div id="legal" class="clip" data-start="0" data-duration="3.6" data-track-index="2">© 2026 BASIT FAROOQ · ALL RIGHTS RESERVED · DO NOT REUPLOAD</div>
      <audio id="sfx-whoosh" src="assets/whoosh.wav" data-start="0" data-duration="1.2" data-track-index="3" data-volume="0.6"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#grid", { scale: 1.1, opacity: 0 }, { scale: 1, opacity: 1, duration: 3.6, ease: "power2.out" }, 0);
      tl.fromTo("#glow", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 0);
      tl.fromTo("#ring", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.8)" }, 0.1);
      tl.fromTo("#ring2", { rotation: -90, opacity: 0 }, { rotation: 60, opacity: 1, duration: 3.0, ease: "power2.out" }, 0.15);
      tl.fromTo("#mono", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0.3);
      tl.fromTo("#name", { opacity: 0, scale: 1.25, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power4.out" }, 0.45);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.7);
      tl.fromTo("#role", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.85);
      tl.fromTo("#legal", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
